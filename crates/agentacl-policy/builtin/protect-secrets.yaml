# Built-in secret protection (policy-model §5). Each rule's `id` is its group;
# a user policy may disable a whole group with `builtin: { disable: [<id>] }`.
# Every group denies both read and write. deny_read also implies a deny of
# unlink/rename/link on the matched paths and their protected ancestors.
version: v1
name: protect-secrets

filesystem:
  deny_read: &secrets
    - { path: "/**/.env", id: env-files, reason: "Environment secret files are protected" }
    - path: "/**/.env.*"
      except: ["**/.env.example", "**/.env.sample", "**/.env.template", "**/.env.dist"]
      id: env-files
      reason: "Environment secret files are protected"
    - { path: "/**/.envrc", id: env-files, reason: "Environment secret files are protected" }

    - { path: "${HOME}/.ssh/**", id: ssh, reason: "SSH keys and configuration are protected" }

    - { path: "${HOME}/.aws/credentials", id: aws, reason: "AWS credentials are protected" }
    - { path: "${HOME}/.aws/sso/cache/**", id: aws, reason: "AWS credentials are protected" }
    - { path: "${HOME}/.aws/cli/cache/**", id: aws, reason: "AWS credentials are protected" }

    - { path: "${HOME}/.config/gcloud/**", id: gcp, reason: "Google Cloud credentials are protected" }

    - { path: "${HOME}/.azure/**", id: azure, reason: "Azure credentials are protected" }

    - { path: "${HOME}/.kube/**", id: kube, reason: "Kubernetes credentials are protected" }

    - { path: "${HOME}/.terraform.d/credentials.tfrc.json", id: terraform, reason: "Terraform credentials and state are protected" }
    - { path: "${HOME}/**/*.tfstate", id: terraform, reason: "Terraform credentials and state are protected" }
    - { path: "${HOME}/**/*.tfstate.backup", id: terraform, reason: "Terraform credentials and state are protected" }
    - { path: "${HOME}/**/terraform.tfvars", id: terraform, reason: "Terraform credentials and state are protected" }
    - { path: "${PROJECT}/**/*.tfstate", id: terraform, reason: "Terraform credentials and state are protected" }
    - { path: "${PROJECT}/**/*.tfstate.backup", id: terraform, reason: "Terraform credentials and state are protected" }
    - { path: "${PROJECT}/**/terraform.tfvars", id: terraform, reason: "Terraform credentials and state are protected" }

    - { path: "${HOME}/.git-credentials", id: git-creds, reason: "Git credentials are protected" }
    - { path: "${HOME}/.config/gh/hosts.yml", id: git-creds, reason: "Git credentials are protected" }

    - { path: "${HOME}/.npmrc", id: package-creds, reason: "Package registry credentials are protected" }
    - { path: "${HOME}/.pypirc", id: package-creds, reason: "Package registry credentials are protected" }
    - { path: "${HOME}/.netrc", id: package-creds, reason: "Package registry credentials are protected" }
    - { path: "${HOME}/.docker/config.json", id: package-creds, reason: "Package registry credentials are protected" }
    - { path: "${HOME}/.cargo/credentials.toml", id: package-creds, reason: "Package registry credentials are protected" }

    - { path: "${HOME}/**/*.pem", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${HOME}/**/*.key", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${HOME}/**/*.p12", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${HOME}/**/*.pfx", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${HOME}/**/id_rsa*", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${HOME}/**/id_ed25519*", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${PROJECT}/**/*.pem", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${PROJECT}/**/*.key", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${PROJECT}/**/*.p12", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${PROJECT}/**/*.pfx", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${PROJECT}/**/id_rsa*", id: keys, reason: "Private keys and certificates are protected" }
    - { path: "${PROJECT}/**/id_ed25519*", id: keys, reason: "Private keys and certificates are protected" }

    - { path: "${HOME}/.gnupg/**", id: gpg, reason: "GPG keys are protected" }

    - { path: "${HOME}/Library/Application Support/Google/Chrome/**", id: browsers, reason: "Browser cookies, saved passwords and sessions are protected" }
    - { path: "${HOME}/Library/Application Support/BraveSoftware/**", id: browsers, reason: "Browser cookies, saved passwords and sessions are protected" }
    - { path: "${HOME}/Library/Application Support/Microsoft Edge/**", id: browsers, reason: "Browser cookies, saved passwords and sessions are protected" }
    - { path: "${HOME}/Library/Application Support/Arc/**", id: browsers, reason: "Browser cookies, saved passwords and sessions are protected" }
    - { path: "${HOME}/Library/Application Support/Firefox/**", id: browsers, reason: "Browser cookies, saved passwords and sessions are protected" }
    - { path: "${HOME}/Library/Cookies/**", id: browsers, reason: "Browser cookies, saved passwords and sessions are protected" }
    - { path: "${HOME}/Library/Safari/**", id: browsers, reason: "Browser cookies, saved passwords and sessions are protected" }
    - { path: "${HOME}/Library/Containers/com.apple.Safari/**", id: browsers, reason: "Browser cookies, saved passwords and sessions are protected" }

    # Synced cloud drives often hold a company's most sensitive documents
    # (contracts, compliance evidence). The project an agent was started in
    # stays usable even when it lives inside one.
    - path: "${HOME}/Library/CloudStorage/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "${HOME}/Library/Mobile Documents/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "${HOME}/Dropbox/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "${HOME}/Dropbox (*)/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "${HOME}/Google Drive/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "${HOME}/OneDrive/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "${HOME}/OneDrive - */**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "${HOME}/Box Sync/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "/Volumes/GoogleDrive*/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    - path: "${HOME}/Box/**"
      except: ["${PROJECT}/**"]
      id: cloud-drives
      reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected"
    # The drive apps' own data: copies of synced file contents (Google
    # Drive's content_cache), sync databases and logs with file names.
    - { path: "${HOME}/Library/Application Support/Google/DriveFS/**", id: cloud-drives, reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected" }
    - { path: "${HOME}/.dropbox/**", id: cloud-drives, reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected" }
    - { path: "${HOME}/Library/Application Support/Box/**", id: cloud-drives, reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected" }
    - { path: "${HOME}/Library/Containers/com.microsoft.OneDrive-mac/**", id: cloud-drives, reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected" }
    - { path: "${HOME}/Library/Group Containers/UBF8T346G9.OneDriveStandaloneSuite/**", id: cloud-drives, reason: "Synced cloud drives (Google Drive, OneDrive, Dropbox, Box, iCloud) are protected" }
  deny_write: *secrets
