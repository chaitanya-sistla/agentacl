# AgentFence's own policy, trust configuration and audit log (threat model T4).
# Cannot be disabled.
version: v1
name: agentfence-self

filesystem:
  deny_write:
    - { path: "${AGENTFENCE_STATE}/**", id: agentfence-self, reason: "AgentFence state and audit log are protected" }
    - { path: "${AGENTFENCE_CONFIG}/**", id: agentfence-self, reason: "AgentFence policy and trust configuration are protected" }
    - { path: "${PROJECT}/.agentfence/**", id: agentfence-self, reason: "Project AgentFence policy is protected" }
