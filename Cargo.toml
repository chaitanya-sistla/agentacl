[workspace]
resolver = "2"
members = ["crates/agentacl-policy", "crates/agentacl-core", "crates/agentacl-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Chaitanya Sistla <sistlachaitanya2@gmail.com>"]
repository = "https://github.com/chaitanya-sistla/agentacl"

[workspace.dependencies]
agentacl-policy = { path = "crates/agentacl-policy" }
agentacl-core = { path = "crates/agentacl-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
sha2 = "0.10"
hex = "0.4"
ulid = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
proptest = "1"
tiny_http = "0.12"

[profile.dev.package."*"]
opt-level = 3
